name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # expo-env.d.ts is generated locally and git-ignored, so recreate it for the type check
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npm run typecheck

      - run: npm test -- --ci
